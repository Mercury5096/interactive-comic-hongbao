<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>互動式網頁漫畫 · Reader</title>
  <link rel="stylesheet" href="assets/css/reader.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'/>">
  <style>
    /* 確保 SVG 蓋在最上面且穿透點擊 */
    .overlay {
      pointer-events: none;
    }

    /* 只有帶有 .interactive 類別的群組才接受滑鼠事件 */
    .hs.interactive {
      pointer-events: auto;
      cursor: pointer;
    }

    /* 鎖定時的樣式 (雙重保險) */
    .hs.locked {
      display: none;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <header>
    <div id="pageTitle" class="title">讀取中…</div>
    <nav class="nav">
      <a id="btnPrev" class="btn" href="#">⟵ 上一頁</a>
      <a id="btnNext" class="btn" href="#">下一頁 ⟶</a>
      <a class="btn" href="index.html">目錄</a>
    </nav>
  </header>

  <div class="wrap">
    <div class="page" id="page">
      <img id="pageImg" src="" alt="" />

      <div class="overlay">
        <svg id="svg" viewBox="0 0 1241 1754" preserveAspectRatio="xMidYMid meet">
          <g id="fxLayer"></g>
          <g id="hotspotLayer"></g>
        </svg>
      </div>
    </div>
  </div>

  <div class="reader-bottom-bar"></div>

  <script>
    // === 全域變數 ===
    let currentStep = 1;
    let pageData = null;
    let autoTimer = null;
    let activeIntervals = []; // 存動畫計時器
    let bgmAudio = null;      // ★ 新增：存 BGM 物件

    // 取得網址參數
    const params = new URLSearchParams(location.search);
    const pageId = params.get('page') || 'pg15';

    // === 預載函數（新增） ===
    // 預載單張圖片（不阻塞主緒）
    function preloadImage(src) {
      if (!src) return Promise.resolve();
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = resolve;
        img.onerror = resolve; // 即使失敗也繼續
        img.src = src;
      });
    }

    // 批量預載下一兩步的資源（非阻塞）
    async function preloadNextResources(stepId) {
      
      if (!pageData || !pageData.steps) return;

      const promises = [];

      // 預載當前步的資源
      const currentStepData = pageData.steps.find(s => s.stepId === stepId);
      if (currentStepData) {
        currentStepData.actions?.forEach(action => {
          if (action.type === 'image_overlay' && action.src) {
            promises.push(preloadImage(action.src));
          } else if (action.type === 'animation' && action.frames) {
            action.frames.forEach(frame => promises.push(preloadImage(frame)));
          }
        });
      }

      // 預載下一兩步的資源（可調整深度，預設2）
      const nextSteps = pageData.steps.filter(s => s.stepId > stepId && s.stepId <= stepId + 2);
      nextSteps.forEach(step => {
        step.actions?.forEach(action => {
          if (action.type === 'image_overlay' && action.src) {
            promises.push(preloadImage(action.src));
          } else if (action.type === 'animation' && action.frames) {
            action.frames.forEach(frame => promises.push(preloadImage(frame)));
          }
        });
      });

      await Promise.all(promises);
      console.log(`Preloaded resources for step ${stepId} and next 2 steps`);
    }

    // === 初始化 ===
    async function init() {
      const jsonPath = `assets/config/${pageId}.json`;

      try {
        console.log(`正在嘗試讀取: ${jsonPath}`);
        const res = await fetch(jsonPath);

        if (!res.ok) {
          throw new Error(`找不到檔案 (HTTP ${res.status})`);
        }

        pageData = await res.json();
        // ★ 新增這行：設定導航按鈕
        setupNavigation(pageId);

        // 1. 設定頁面資訊
        document.title = pageData.page.title || `漫畫閱讀 - ${pageId}`;
        document.getElementById('pageTitle').textContent = pageData.page.title || pageId;

        // 2. 設定背景圖
        const img = document.getElementById('pageImg');
        img.src = pageData.page.image;
        img.onload = () => img.classList.add('ready');

        // 3. 設定畫布
        const svg = document.getElementById('svg');
        svg.setAttribute('viewBox', `0 0 ${pageData.page.width} ${pageData.page.height}`);

        // ★ 4. 處理 BGM (背景音樂) ★
        if (pageData.page.bgm) {
          setupBGM(pageData.page.bgm);
        }

        // 5. 開始渲染第一步
        renderStep(1);

        // 新增：預載第一步 + 下一兩步資源
        preloadNextResources(1);

      } catch (err) {
        console.error(err);
        alert(`讀取錯誤：\n請確認 ${jsonPath} 是否存在。\n\n詳細錯誤：${err.message}`);
      }
    }

    // ★ BGM 設定函數 (含自動播放解鎖) ★
    function setupBGM(src) {
      bgmAudio = new Audio(src);
      bgmAudio.loop = true;  // 設定循環播放
      bgmAudio.volume = 0.5; // 音量設為 50%，避免太大聲

      // 嘗試直接播放
      bgmAudio.play().then(() => {
        console.log("BGM 自動播放成功");
      }).catch(err => {
        console.log("BGM 自動播放被阻擋，等待使用者點擊...", err);
        // 如果失敗，添加一個「一次性」的點擊監聽器
        document.addEventListener('click', () => {
          if (bgmAudio.paused) {
            bgmAudio.play();
            console.log("使用者點擊，BGM 開始播放");
          }
        }, { once: true }); // once: true 表示這個監聽器只會執行一次就自動移除
      });
    }

    // === 核心：渲染步驟 ===
    function renderStep(stepId) {
      console.log(`執行步驟: ${stepId}`);
      currentStep = stepId;

      // 1. 清除上一步的熱點
      const hotspotLayer = document.getElementById('hotspotLayer');
      hotspotLayer.innerHTML = '';

      // 2. 清除上一步的特效層（避免殘留）
      const fxLayer = document.getElementById('fxLayer');
      fxLayer.innerHTML = '';

      // 清除上一步的計時器
      activeIntervals.forEach(clearInterval);
      activeIntervals = [];

      if (autoTimer) {
        clearTimeout(autoTimer);
        autoTimer = null;
      }

      // 找出當前步驟
      const step = pageData.steps.find(s => s.stepId === stepId);
      if (!step) return console.error(`找不到步驟 ${stepId}`);

      // 執行所有動作
      step.actions?.forEach(executeAction);

      // 新增熱點
      step.hotspots?.forEach(hs => {
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.classList.add('hs', 'interactive');
        g.dataset.nextStep = step.nextStep;

        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("x", hs.x);
        rect.setAttribute("y", hs.y);
        rect.setAttribute("width", hs.width);
        rect.setAttribute("height", hs.height);

        g.appendChild(rect);
        hotspotLayer.appendChild(g);

        // 點擊事件
        g.addEventListener('click', () => {
          if (step.type === 'interaction') renderStep(step.nextStep);
        });
      });

      // 如果是自動步驟，設定計時器
      if (step.type === 'auto' && step.duration) {
        autoTimer = setTimeout(() => renderStep(step.nextStep), step.duration);
      }

      // 新增：預載下一兩步資源
      preloadNextResources(stepId + 1);
    }

    // 執行單一動作
    function executeAction(action) {
      if (action.type === 'image_overlay') {
        createOverlayImage(action.src, {
          x: action.x,
          y: action.y,
          width: action.width,
          height: action.height,
          cssClass: action.cssClass
        });
      } else if (action.type === 'animation') {
        const img = createOverlayImage(action.frames[0], {
          x: action.x,
          y: action.y,
          width: action.width,
          height: action.height,
          cssClass: action.cssClass
        });

        let frameIndex = 0;
        const interval = setInterval(() => {
          frameIndex = (frameIndex + 1) % action.frames.length;
          img.setAttributeNS('http://www.w3.org/1999/xlink', 'href', action.frames[frameIndex]);
        }, action.interval);

        activeIntervals.push(interval);
      } else if (action.type === 'sfx') {
        const sfx = new Audio(action.src);
        sfx.volume = action.volume || 1.0;
        sfx.play();
      } else if (action.type === 'change_bgm') {
        if (action.src && action.src !== 'none') {
          setupBGM(action.src);
        } else {
          bgmAudio = null; // 如果設為 none，就變靜音
        }
      } else if (action.type === 'fade_out_bgm') {
        if (bgmAudio) {
          const duration = action.duration || 1000; // 預設 1秒
          const originalVolume = bgmAudio.volume;
          const stepTime = 50; // 每 50ms 調整一次
          const steps = duration / stepTime;
          const volStep = originalVolume / steps;

          const fadeInterval = setInterval(() => {
            // 防止因為浮點數計算導致音量變成負數
            if (bgmAudio.volume > volStep) {
              bgmAudio.volume -= volStep;
            } else {
              // 音量歸零後，停止播放並清除
              bgmAudio.volume = 0;
              bgmAudio.pause();
              clearInterval(fadeInterval);
            }
          }, stepTime);
        }
      }
    }

    // 輔助函數
    function createOverlayImage(src, config) {
      const fxLayer = document.getElementById('fxLayer');
      const img = document.createElementNS("http://www.w3.org/2000/svg", "image");
      img.setAttributeNS('http://www.w3.org/1999/xlink', 'href', src);
      img.setAttribute("x", config.x);
      img.setAttribute("y", config.y);
      if (config.width) img.setAttribute("width", config.width);
      if (config.height) img.setAttribute("height", config.height);
      if (config.cssClass) img.setAttribute("class", config.cssClass);
      fxLayer.appendChild(img);
      return img;
    }

    // 啟動程式
    init();

    // === 設定上一頁/下一頁按鈕 (支援 A/B 雙路線) ===
    function setupNavigation(currentId) {
      // 1. 定義 A 路線順序 (好結局)
      const routeA = [
        'cover',
        'pg01', 'pg02', 'pg03', 'pg04', 'pg05',
        'pg06', 'pg07', 'pg08', 'pg09', 'pg10',
        'pg11', 'pg12', 'pg13', 'pg14', 'pg15',
        'pg16', 'pg17', 'pg18', 'pg19'
      ];

      // 2. 定義 B 路線順序 (壞結局)
      // 注意：這裡必須包含所有 B 路線會經過的頁面
      const routeB = [
        'pg10B', 
        'pg11B', 
        'pg12B', 
        'pg13B', 
        'pg14B', 
        'pg15B', 
        'pg16B'
      ];

      // 3. 判斷當前頁面屬於哪條路線
      let pageOrder = routeA; // 預設走 A 路線

      // 如果當前頁面 ID 存在於 B 路線清單中，就切換成 B 路線
      if (routeB.includes(currentId)) {
        pageOrder = routeB;
      }
      
      const currentIndex = pageOrder.indexOf(currentId);
      const btnPrev = document.getElementById('btnPrev');
      const btnNext = document.getElementById('btnNext');

      // --- 設定上一頁按鈕 ---
      if (currentIndex > 0) {
        // 有上一頁
        const prevPage = pageOrder[currentIndex - 1];
        btnPrev.href = `reader.html?page=${prevPage}`;
        btnPrev.style.opacity = 1;
        btnPrev.style.pointerEvents = 'auto';
      } else {
        // 第一頁 (或者是 pg10B 的情況)
        // 如果是 pg10B (B路線的第一頁)，上一頁其實應該回 pg10 (抉擇點)
        if (currentId === 'pg10B') {
             btnPrev.href = `reader.html?page=pg10`;
             btnPrev.style.opacity = 1;
             btnPrev.style.pointerEvents = 'auto';
        } else {
             // 真的沒有上一頁了 (Cover)
             btnPrev.style.opacity = 0.3;
             btnPrev.style.pointerEvents = 'none';
        }
      }

      // --- 設定下一頁按鈕 ---
      if (currentIndex >= 0 && currentIndex < pageOrder.length - 1) {
        const nextPage = pageOrder[currentIndex + 1];
        btnNext.href = `reader.html?page=${nextPage}`;
        btnNext.style.opacity = 1;
        btnNext.style.pointerEvents = 'auto';
      } else {
        // 最後一頁
        btnNext.style.opacity = 0.3;
        btnNext.style.pointerEvents = 'none';
      }
    }

  </script>
</body>

</html>

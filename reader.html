<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>互動式網頁漫畫 · Reader</title>
  <link rel="stylesheet" href="assets/css/reader.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'/>">
  <style>
    /* 確保 SVG 蓋在最上面且穿透點擊 */
    .overlay {
      pointer-events: none;
    }

    /* 只有帶有 .interactive 類別的群組才接受滑鼠事件 */
    .hs.interactive {
      pointer-events: auto;
      cursor: pointer;
    }

    /* 鎖定時的樣式 (雙重保險) */
    .hs.locked {
      display: none;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <header>
    <div id="pageTitle" class="title">讀取中…</div>
    <nav class="nav">
      <a id="btnPrev" class="btn" href="#">⟵ 上一頁</a>
      <a id="btnNext" class="btn" href="#">下一頁 ⟶</a>
      <a class="btn" href="index.html">目錄</a>
    </nav>
  </header>

  <div class="wrap">
    <div class="page" id="page">
      <img id="pageImg" src="" alt="" />

      <div class="overlay">
        <svg id="svg" viewBox="0 0 1241 1754" preserveAspectRatio="xMidYMid meet">
          <g id="fxLayer"></g>
          <g id="hotspotLayer"></g>
        </svg>
      </div>
    </div>
  </div>

  <div class="reader-bottom-bar"></div>

  <script>
    // === 全域變數 ===
    let currentStep = 1;
    let pageData = null;
    let autoTimer = null;
    let activeIntervals = []; // 存動畫計時器
    let bgmAudio = null;      // ★ 新增：存 BGM 物件

    // 取得網址參數
    const params = new URLSearchParams(location.search);
    const pageId = params.get('page') || 'pg15';

    // === 初始化 ===
    async function init() {
      const jsonPath = `assets/config/${pageId}.json`;

      try {
        console.log(`正在嘗試讀取: ${jsonPath}`);
        const res = await fetch(jsonPath);

        if (!res.ok) {
          throw new Error(`找不到檔案 (HTTP ${res.status})`);
        }

        pageData = await res.json();
        // ★ 新增這行：設定導航按鈕
        setupNavigation(pageId);

        // 1. 設定頁面資訊
        document.title = pageData.page.title || `漫畫閱讀 - ${pageId}`;
        document.getElementById('pageTitle').textContent = pageData.page.title || pageId;

        // 2. 設定背景圖
        const img = document.getElementById('pageImg');
        img.src = pageData.page.image;
        img.onload = () => img.classList.add('ready');

        // 3. 設定畫布
        const svg = document.getElementById('svg');
        svg.setAttribute('viewBox', `0 0 ${pageData.page.width} ${pageData.page.height}`);

        // ★ 4. 處理 BGM (背景音樂) ★
        if (pageData.page.bgm) {
          setupBGM(pageData.page.bgm);
        }

        // 5. 開始渲染第一步
        renderStep(1);

      } catch (err) {
        console.error(err);
        alert(`讀取錯誤：\n請確認 ${jsonPath} 是否存在。\n\n詳細錯誤：${err.message}`);
      }
    }

    // ★ BGM 設定函數 (含自動播放解鎖) ★
    function setupBGM(src) {
      bgmAudio = new Audio(src);
      bgmAudio.loop = true;  // 設定循環播放
      bgmAudio.volume = 0.5; // 音量設為 50%，避免太大聲

      // 嘗試直接播放
      bgmAudio.play().then(() => {
        console.log("BGM 自動播放成功");
      }).catch(err => {
        console.log("BGM 自動播放被阻擋，等待使用者點擊...", err);
        // 如果失敗，添加一個「一次性」的點擊監聽器
        document.addEventListener('click', () => {
          if (bgmAudio.paused) {
            bgmAudio.play();
            console.log("使用者點擊，BGM 開始播放");
          }
        }, { once: true }); // once: true 表示這個監聽器只會執行一次就自動移除
      });
    }

    // === 核心：渲染步驟 ===
    function renderStep(stepId) {
      console.log(`執行步驟: ${stepId}`);
      currentStep = stepId;

      // 1. 清除上一步的熱點
      const hotspotLayer = document.getElementById('hotspotLayer');
      hotspotLayer.innerHTML = ''; 
      
      // ★ 2. 新增這行：清除上一步的特效/圖片 (解決 pg02 最後紅包殘留的問題)
      document.getElementById('fxLayer').innerHTML = '';

      // 3. 清除計時器與動畫
      clearTimeout(autoTimer);
      activeIntervals.forEach(id => clearInterval(id));
      activeIntervals = [];

      // 找步驟
      const stepData = pageData.steps.find(s => s.stepId === stepId);

      if (!stepData) {
        console.warn('找不到步驟資料，可能已結束');
        return;
      }

      // 執行 Actions
      if (stepData.actions) {
        stepData.actions.forEach(action => executeAction(action));
      }

      // 判斷互動類型
      if (stepData.type === 'auto') {
        const duration = stepData.duration || 1000;
        autoTimer = setTimeout(() => {
          renderStep(stepData.nextStep);
        }, duration);
      }
      else if (stepData.type === 'interaction') {
        if (stepData.hotspots) {
          stepData.hotspots.forEach(hs => {
            // 支援分支選擇：優先用熱點的 nextStep
            createHotspot(hs, hs.nextStep || stepData.nextStep);
          });
        }
      }
    }

    // === 建立熱點 ===
    // === 建立熱點 (修改後：支援跳轉頁面) ===
    function createHotspot(hsData, nextStepId) {
      const layer = document.getElementById('hotspotLayer');
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.setAttribute("class", "hs interactive");

      const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      rect.setAttribute("x", hsData.x);
      rect.setAttribute("y", hsData.y);
      rect.setAttribute("width", hsData.width);
      rect.setAttribute("height", hsData.height);

      // ★ 修改重點：判斷是否為跳轉指令 ★
      g.onclick = () => {
        // 如果 nextStepId 是字串且以 'goto:' 開頭 (例如 'goto:pg10b')
        if (typeof nextStepId === 'string' && nextStepId.startsWith('goto:')) {
            const targetPage = nextStepId.split(':')[1];
            // 跳轉網址
            window.location.href = `reader.html?page=${targetPage}`;
        } else {
            // 否則維持原本的步驟切換
            renderStep(nextStepId);
        }
      };

      g.appendChild(rect);
      layer.appendChild(g);
    }

    // === 執行動作 (支援動畫與特效) ===
    // === 執行動作 (升級版 v4：支援動畫不循環) ===
    function executeAction(action) {
      if (action.type === 'image_swap') {
        const img = document.getElementById('pageImg');
        img.src = action.src;
        if (action.cssClass) {
          img.className = ''; 
          void img.offsetWidth; 
          img.className = action.cssClass; 
        }
      } 
      else if (action.type === 'sfx') {
        const audio = new Audio(action.src);
        audio.play().catch(e => console.log('音效播放失敗:', e));
      }
      else if (action.type === 'image_overlay') {
        createOverlayImage(action.src, action);
      }
      // ★ 修改重點：動畫控制 ★
      else if (action.type === 'animation') {
        // 顯示第一張圖
        const img = createOverlayImage(action.frames[0], action);
        let frameIndex = 0;
        
        const intervalId = setInterval(() => {
          let nextIndex = frameIndex + 1;

          // 檢查是否播完
          if (nextIndex >= action.frames.length) {
            // 如果設定為「不循環 (loop: false)」，就停止計時器
            if (action.loop === false) {
              clearInterval(intervalId);
              console.log("動畫播放完畢，停在最後一張");
              return; // 停在最後一張，不再更新
            }
            // 否則回到第一張
            nextIndex = 0;
          }
          
          frameIndex = nextIndex;
          img.setAttributeNS('http://www.w3.org/1999/xlink', 'href', action.frames[frameIndex]);
        }, action.interval || 100);

        activeIntervals.push(intervalId);
      }
        // ★ 新增：支援切換背景音樂 (Switch BGM) ★
      else if (action.type === 'change_bgm') {
        // 1. 如果原本有在播音樂，先停掉
        if (bgmAudio) {
          bgmAudio.pause();
          bgmAudio.currentTime = 0; // 重置時間
        }

        // 2. 播放新的音樂 (如果不為 none)
        if (action.src && action.src !== 'none') {
           setupBGM(action.src);
        } else {
           bgmAudio = null; // 如果設為 none，就變靜音
        }
      }
      else if (action.type === 'fade_out_bgm') {
        if (bgmAudio) {
          const duration = action.duration || 1000; // 預設 1秒
          const originalVolume = bgmAudio.volume;
          const stepTime = 50; // 每 50ms 調整一次
          const steps = duration / stepTime;
          const volStep = originalVolume / steps;

          const fadeInterval = setInterval(() => {
            // 防止因為浮點數計算導致音量變成負數
            if (bgmAudio.volume > volStep) {
              bgmAudio.volume -= volStep;
            } else {
              // 音量歸零後，停止播放並清除
              bgmAudio.volume = 0;
              bgmAudio.pause();
              clearInterval(fadeInterval);
            }
          }, stepTime);
        }
      }
      }
    

    // 輔助函數
    function createOverlayImage(src, config) {
      const fxLayer = document.getElementById('fxLayer');
      const img = document.createElementNS("http://www.w3.org/2000/svg", "image");
      img.setAttributeNS('http://www.w3.org/1999/xlink', 'href', src);
      img.setAttribute("x", config.x);
      img.setAttribute("y", config.y);
      if (config.width) img.setAttribute("width", config.width);
      if (config.height) img.setAttribute("height", config.height);
      if (config.cssClass) img.setAttribute("class", config.cssClass);
      fxLayer.appendChild(img);
      return img;
    }

    // 啟動程式
    init();

    // === 設定上一頁/下一頁按鈕 (支援 A/B 雙路線) ===
    function setupNavigation(currentId) {
      // 1. 定義 A 路線順序 (好結局)
      const routeA = [
        'cover',
        'pg01', 'pg02', 'pg03', 'pg04', 'pg05',
        'pg06', 'pg07', 'pg08', 'pg09', 'pg10',
        'pg11', 'pg12', 'pg13', 'pg14', 'pg15',
        'pg16', 'pg17', 'pg18', 'pg19'
      ];

      // 2. 定義 B 路線順序 (壞結局)
      // 注意：這裡必須包含所有 B 路線會經過的頁面
      const routeB = [
        'pg10B', 
        'pg11B', 
        'pg12B', 
        'pg13B', 
        'pg14B', 
        'pg15B', 
        'pg16B'
      ];

      // 3. 判斷當前頁面屬於哪條路線
      let pageOrder = routeA; // 預設走 A 路線

      // 如果當前頁面 ID 存在於 B 路線清單中，就切換成 B 路線
      if (routeB.includes(currentId)) {
        pageOrder = routeB;
      }
      
      const currentIndex = pageOrder.indexOf(currentId);
      const btnPrev = document.getElementById('btnPrev');
      const btnNext = document.getElementById('btnNext');

      // --- 設定上一頁按鈕 ---
      if (currentIndex > 0) {
        // 有上一頁
        const prevPage = pageOrder[currentIndex - 1];
        btnPrev.href = `reader.html?page=${prevPage}`;
        btnPrev.style.opacity = 1;
        btnPrev.style.pointerEvents = 'auto';
      } else {
        // 第一頁 (或者是 pg10B 的情況)
        // 如果是 pg10B (B路線的第一頁)，上一頁其實應該回 pg10 (抉擇點)
        if (currentId === 'pg10B') {
             btnPrev.href = `reader.html?page=pg10`;
             btnPrev.style.opacity = 1;
             btnPrev.style.pointerEvents = 'auto';
        } else {
             // 真的沒有上一頁了 (Cover)
             btnPrev.style.opacity = 0.3;
             btnPrev.style.pointerEvents = 'none';
        }
      }

      // --- 設定下一頁按鈕 ---
      if (currentIndex >= 0 && currentIndex < pageOrder.length - 1) {
        const nextPage = pageOrder[currentIndex + 1];
        btnNext.href = `reader.html?page=${nextPage}`;
        btnNext.style.opacity = 1;
        btnNext.style.pointerEvents = 'auto';
      } else {
        // 最後一頁
        btnNext.style.opacity = 0.3;
        btnNext.style.pointerEvents = 'none';
      }
    }

  </script>
</body>

</html>
